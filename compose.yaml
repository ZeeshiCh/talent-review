services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hiring
      POSTGRES_PASSWORD: hiring_local
      POSTGRES_DB: hiring
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiring -d hiring"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
